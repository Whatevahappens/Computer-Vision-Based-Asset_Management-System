server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
